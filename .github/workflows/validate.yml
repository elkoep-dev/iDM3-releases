name: Validate

# The catalogue reaches every iDM3 installation at once, so nothing merges unvalidated.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: Firmware archives
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate naming, duplicates and archive contents
        shell: pwsh
        run: .\tools\Test-FirmwareNames.ps1

  catalogue:
    name: Catalogue and signature
    runs-on: windows-latest
    steps:
      # Two commits, so the published Sequence can be read from the previous state
      # and a rollback caught before it merges.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Read the currently published Sequence
        id: published
        shell: pwsh
        run: |
          $previous = 0
          $ref = if ($env:GITHUB_EVENT_NAME -eq 'pull_request') { 'origin/' + $env:GITHUB_BASE_REF } else { 'HEAD^' }
          $raw = git show "${ref}:catalog.xml" 2>$null
          if ($LASTEXITCODE -eq 0 -and -not [string]::IsNullOrWhiteSpace($raw)) {
            try {
              $doc = New-Object System.Xml.XmlDocument
              $doc.LoadXml(($raw -join "`n"))
              $previous = [int]$doc.FirmwareCatalog.Sequence
            }
            catch {
              Write-Output "::warning::The published catalogue could not be parsed; the rollback check is skipped."
            }
          }
          Write-Output "Published sequence: $previous"
          "sequence=$previous" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify the catalogue, its signature and every digest
        shell: pwsh
        run: .\tools\Test-Catalog.ps1 -PreviousSequence ${{ steps.published.outputs.sequence }}

  secrets:
    name: No private key material
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fail if a private key was committed
        run: |
          if git ls-files | grep -Ei '\.(private\.xml|key|pem|pfx|p12)$'; then
            echo "::error::Private key material is present in the repository."
            exit 1
          fi
          if git grep -lE 'BEGIN (RSA |EC )?PRIVATE KEY' -- . ; then
            echo "::error::A PEM private key block is present in the repository."
            exit 1
          fi
          echo "No private key material found."
